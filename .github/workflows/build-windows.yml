name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.14.2

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Build standalone Windows executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name OnyxiaEXE --collect-all psutil main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnyxiaEXE-Windows-x64
          path: dist/OnyxiaEXE.exe
          if-no-files-found: error
          retention-days: 14
