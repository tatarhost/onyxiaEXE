name: Build Native Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure native C++ project
        run: cmake -S . -B build -A x64

      - name: Build Release EXE
        run: cmake --build build --config Release --parallel

      - name: Upload standalone executable
        uses: actions/upload-artifact@v4
        with:
          name: OnyxiaEXE-Cpp-Windows-x64
          path: build/Release/OnyxiaEXE.exe
          if-no-files-found: error
          retention-days: 14
